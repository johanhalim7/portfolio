      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)" />
  <circle cx="200" cy="150" r="220" fill="#2563eb" opacity="0.2" filter="blur(80px)" />
  <circle cx="1050" cy="480" r="250" fill="#7c3aed" opacity="0.2" filter="blur(90px)" />

