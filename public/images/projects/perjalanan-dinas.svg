<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="dprdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadowDprd" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#dprdBg)" />
  <circle cx="150" cy="500" r="220" fill="#2563eb" opacity="0.12" filter="blur(80px)" />
  <circle cx="1050" cy="180" r="200" fill="#0284c7" opacity="0.12" filter="blur(80px)" />

  <!-- Browser Container -->
  <g transform="translate(60, 45)" filter="url(#shadowDprd)">
    <!-- Frame -->
    <rect width="1080" height="585" rx="14" fill="#0b1329" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect width="1080" height="42" rx="14" fill="#131e3a" />
    <circle cx="24" cy="21" r="6" fill="#ef4444" />
    <circle cx="44" cy="21" r="6" fill="#f59e0b" />
    <circle cx="64" cy="21" r="6" fill="#10b981" />

    <rect x="250" y="8" width="580" height="26" rx="6" fill="#0b1120" stroke="#1e293b" />
    <text x="540" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">
      🏢 https://sppd.dprd-kotacirebon.go.id/dashboard/perjalanan-dinas
    </text>

    <!-- App Topbar -->
    <rect x="0" y="42" width="1080" height="56" fill="#0e1726" stroke="#1e293b" stroke-width="1" />
    <text x="30" y="77" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="16">
      SIM-SPPD DPRD <tspan fill="#38bdf8">Kota Cirebon</tspan>
    </text>
    <rect x="900" y="55" width="150" height="30" rx="6" fill="#1e293b" />
    <circle cx="918" cy="70" r="8" fill="#3b82f6" />
    <text x="935" y="75" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Admin Sekretariat</text>

    <!-- Sidebar & Main Content -->
    <!-- Sidebar -->
    <g transform="translate(0, 98)">
      <rect width="210" height="487" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
      
      <!-- Nav Items -->
      <g transform="translate(15, 20)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
        <rect x="0" y="0" width="180" height="36" rx="6" fill="#1d4ed8" />
        <text x="15" y="23" fill="#ffffff" font-weight="600">📊 Dashboard Utama</text>

        <text x="15" y="65" fill="#94a3b8">📝 Pengajuan SPPD</text>
        <text x="15" y="105" fill="#94a3b8">📑 Surat Tugas (ST)</text>
        <text x="15" y="145" fill="#94a3b8">✍️ Verifikasi &amp; Disposisi</text>
        <text x="15" y="185" fill="#94a3b8">💰 Rincian Anggaran</text>
        <text x="15" y="225" fill="#94a3b8">📈 Rekapitulasi Laporan</text>
        <text x="15" y="265" fill="#94a3b8">⚙️ Manajemen User</text>
      </g>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(240, 118)" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
      <!-- Title & Action -->
      <text x="0" y="20" fill="#f8fafc" font-size="20" font-weight="700">Dashboard Pengelolaan Perjalanan Dinas</text>
      <text x="0" y="42" fill="#64748b" font-size="13">Sistem Informasi Pengajuan, Rekapitulasi, dan Laporan Anggaran SPPD</text>

      <rect x="660" y="0" width="150" height="38" rx="8" fill="#2563eb" />
      <text x="735" y="24" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">+ Buat SPPD Baru</text>

      <!-- Stat Cards -->
      <g transform="translate(0, 65)">
        <!-- Card 1 -->
        <rect width="185" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <text x="16" y="28" fill="#64748b" font-size="11" font-weight="600">TOTAL PENGAJUAN</text>
        <text x="16" y="58" fill="#f8fafc" font-size="24" font-weight="800">148</text>
        <text x="65" y="58" fill="#10b981" font-size="11">↑ Aktif</text>

        <!-- Card 2 -->
        <g transform="translate(205, 0)">
          <rect width="185" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
          <text x="16" y="28" fill="#64748b" font-size="11" font-weight="600">MENUNGGU VERIFIKASI</text>
          <text x="16" y="58" fill="#f59e0b" font-size="24" font-weight="800">12</text>
          <text x="50" y="58" fill="#f59e0b" font-size="11">Perlu Disposisi</text>
        </g>

        <!-- Card 3 -->
        <g transform="translate(410, 0)">
          <rect width="185" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
          <text x="16" y="28" fill="#64748b" font-size="11" font-weight="600">DISETUJUI / BERJALAN</text>
          <text x="16" y="58" fill="#10b981" font-size="24" font-weight="800">126</text>
          <text x="65" y="58" fill="#10b981" font-size="11">Terdokumentasi</text>
        </g>

        <!-- Card 4 -->
        <g transform="translate(615, 0)">
          <rect width="195" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
          <text x="16" y="28" fill="#64748b" font-size="11" font-weight="600">TEREALISASI ANGGARAN</text>
          <text x="16" y="58" fill="#38bdf8" font-size="18" font-weight="800">Rp 482,5 Jt</text>
          <text x="16" y="74" fill="#64748b" font-size="10">Kuartal Berjalan</text>
        </g>
      </g>

      <!-- Data Table Preview -->
      <g transform="translate(0, 175)">
        <rect width="810" height="255" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        
        <!-- Table Header -->
        <rect width="810" height="38" rx="10" fill="#1e293b" />
        <text x="20" y="24" fill="#94a3b8" font-size="11" font-weight="700">NO. SPPD</text>
        <text x="160" y="24" fill="#94a3b8" font-size="11" font-weight="700">NAMA PEGAWAI / KOMISI</text>
        <text x="380" y="24" fill="#94a3b8" font-size="11" font-weight="700">TUJUAN &amp; KEPERLUAN</text>
        <text x="590" y="24" fill="#94a3b8" font-size="11" font-weight="700">STATUS</text>
        <text x="720" y="24" fill="#94a3b8" font-size="11" font-weight="700">AKSI</text>

        <!-- Row 1 -->
        <g transform="translate(20, 65)">
          <text x="0" y="0" fill="#cbd5e1" font-family="monospace" font-size="12">094/SPPD/DPRD/X</text>
          <text x="140" y="0" fill="#f8fafc" font-size="12" font-weight="600">Drs. H. Mulyadi (Komisi I)</text>
          <text x="360" y="0" fill="#94a3b8" font-size="12">Konsultasi Raperda — Bandung</text>
          <rect x="570" y="-14" width="80" height="22" rx="4" fill="#065f46" />
          <text x="610" y="1" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">Disetujui</text>
          <text x="700" y="0" fill="#38bdf8" font-size="12">Detail / PDF</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(20, 115)">
          <text x="0" y="0" fill="#cbd5e1" font-family="monospace" font-size="12">095/SPPD/DPRD/X</text>
          <text x="140" y="0" fill="#f8fafc" font-size="12" font-weight="600">Tim Anggaran Sekretariat</text>
          <text x="360" y="0" fill="#94a3b8" font-size="12">Kunjungan Kerja Bappeda — Jakarta</text>
          <rect x="570" y="-14" width="80" height="22" rx="4" fill="#78350f" />
          <text x="610" y="1" fill="#fde68a" font-size="10" font-weight="600" text-anchor="middle">Review</text>
          <text x="700" y="0" fill="#38bdf8" font-size="12">Detail / PDF</text>
        </g>

        <!-- Row 3 -->
        <g transform="translate(20, 165)">
          <text x="0" y="0" fill="#cbd5e1" font-family="monospace" font-size="12">096/SPPD/DPRD/X</text>
          <text x="140" y="0" fill="#f8fafc" font-size="12" font-weight="600">Badan Kehormatan DPRD</text>
          <text x="360" y="0" fill="#94a3b8" font-size="12">Studi Banding Tatib — Semarang</text>
          <rect x="570" y="-14" width="80" height="22" rx="4" fill="#1e3a8a" />
          <text x="610" y="1" fill="#93c5fd" font-size="10" font-weight="600" text-anchor="middle">Selesai</text>
          <text x="700" y="0" fill="#38bdf8" font-size="12">Detail / PDF</text>
        </g>

        <!-- Row 4 -->
        <g transform="translate(20, 215)">
          <text x="0" y="0" fill="#cbd5e1" font-family="monospace" font-size="12">097/SPPD/DPRD/X</text>
          <text x="140" y="0" fill="#f8fafc" font-size="12" font-weight="600">Bagus Prasetyo, S.AP</text>
          <text x="360" y="0" fill="#94a3b8" font-size="12">Bimtek Pengelolaan Arsip — Cirebon</text>
          <rect x="570" y="-14" width="80" height="22" rx="4" fill="#065f46" />
          <text x="610" y="1" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">Disetujui</text>
          <text x="700" y="0" fill="#38bdf8" font-size="12">Detail / PDF</text>
        </g>
      </g>
    </g>
  </g>
</svg>
